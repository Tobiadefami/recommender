version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: ./recommender/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./recommender:/app/recommender
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:password@db/reddit_data
      - REDDIT_APP_CLIENT_ID=${REDDIT_APP_CLIENT_ID}
      - REDDIT_APP_CLIENT_SECRET=${REDDIT_APP_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}

    command: python -m uvicorn recommender.app:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=reddit_data
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5900:5900"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@domain.com"
      PGADMIN_DEFAULT_PASSWORD: "SuperSecret"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
